name: Pipeline 2 - Platform Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: read
  security-events: write

jobs:
  deploy-platform:
    runs-on:
      - self-hosted
      - Linux
      - X64

    env:
      # Config Server credentials
      GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
      GIT_TOKEN: ${{ secrets.GIT_TOKEN }}

      # Vault
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      VAULT_PORT: ${{ secrets.VAULT_PORT }}
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}

    steps:

      - name: Checkout Infrastructure Repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GIT_TOKEN }}

      #######################################################
      # Deploy Infrastructure
      #######################################################

      - name: Deploy Infrastructure
        run: |
          docker compose \
            --env-file compose/.env \
            --env-file compose/versions.env \
            -f compose/infrastructure.yml \
            up -d

      - name: Wait for Infrastructure
        run: sleep 20

      #######################################################
      # Deploy Platform
      #######################################################

      - name: Deploy Platform
        run: |
          docker compose \
            --env-file compose/.env \
            --env-file compose/versions.env \
            -f compose/platform.yml \
            up -d

      - name: Wait for Platform
        run: sleep 20

      - name: Test Config Server Before Apps
        run: |
          curl http://localhost:8888/service-user/default
          curl http://localhost:8888/actuator/health

      #######################################################
      # Deploy Applications
      #######################################################

      - name: Deploy Applications
        run: |
          docker compose \
            --env-file compose/.env \
            --env-file compose/versions.env \
            -f compose/application.yml \
            up -d

      - name: Wait for Applications
        run: sleep 20

      #######################################################
      # Deploy Monitoring
      #######################################################

      - name: Deploy Monitoring
        run: |
          docker compose \
            --env-file compose/.env \
            --env-file compose/versions.env \
            -f compose/monitoring.yml \
            up -d

      - name: Wait for Monitoring
        run: sleep 20

      #######################################################
      # Health Checks
      #######################################################

      - name: Verify Running Containers
        run: docker ps

      #######################################################
      # OWASP ZAP - Authenticated Scan
      #######################################################

      - name: Test Gateway
        run: |
          curl -v "${{ vars.ZAP_TARGET_URL }}/actuator/health"

      - name: Get Keycloak Token
        run: |
          ZAP_ACCESS_TOKEN=$(curl -s -X POST "${{ vars.KEYCLOAK_TOKEN_URL }}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=password" \
            -d "client_id=${{ secrets.ZAP_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.ZAP_CLIENT_SECRET }}" \
            -d "username=${{ secrets.ZAP_USERNAME }}" \
            -d "password=${{ secrets.ZAP_PASSWORD }}" \
            | jq -r '.access_token')

          echo "ZAP_ACCESS_TOKEN=$ZAP_ACCESS_TOKEN" >> $GITHUB_ENV
          echo "Token fetched successfully"

      - name: Run Authenticated ZAP Scan
        run: |
          docker run --rm \
            --network=host \
            -v ${{ github.workspace }}:/zap/wrk \
            -e ZAP_ACCESS_TOKEN="${{ env.ZAP_ACCESS_TOKEN }}" \
            -e ZAP_PORT=8092 \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py \
            -t "${{ vars.ZAP_TARGET_URL }}" \
            -r report.html \
            -J report.json \
            -w report.md \
            -x report.xml \
            -z "-config proxy.port=8092
                -config replacer.full_list(0).description=Authorization \
                -config replacer.full_list(0).enabled=true \
                -config replacer.full_list(0).matchtype=REQ_HEADER \
                -config replacer.full_list(0).matchstr=Authorization \
                -config replacer.full_list(0).replacement=Bearer\ ${ZAP_ACCESS_TOKEN}"
        continue-on-error: true

      #######################################################
      # Upload Reports
      #######################################################

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            report.html
            report.json
            report.md
            report.xml