name: Pipeline 2 - Platform Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: read
  security-events: write

jobs:
  deploy-platform:
    runs-on:
      - self-hosted
      - Linux
      - X64

    env:
      # Config Server credentials
      GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
      GIT_TOKEN: ${{ secrets.GIT_TOKEN }}

      # Vault
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      VAULT_PORT: ${{ secrets.VAULT_PORT }}
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}

    steps:

      - name: Checkout Infrastructure Repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GIT_TOKEN }}

      #######################################################
      # Deploy Infrastructure
      #######################################################

      - name: Deploy Infrastructure
        run: |
          docker compose \
            --env-file compose/.env \
            --env-file compose/versions.env \
            -f compose/infrastructure.yml \
            up -d

      - name: Wait for Infrastructure
        run: sleep 20

      #######################################################
      # Deploy Platform
      #######################################################

      - name: Deploy Platform
        run: |
          docker compose \
            --env-file compose/.env \
            --env-file compose/versions.env \
            -f compose/platform.yml \
            up -d

      - name: Wait for Platform
        run: sleep 20

      - name: Test Config Server Before Apps
        run: |
          curl http://localhost:8888/service-user/default
          curl http://localhost:8888/actuator/health

      #######################################################
      # Deploy Applications
      #######################################################

      - name: Deploy Applications
        run: |
          docker compose \
            --env-file compose/.env \
            --env-file compose/versions.env \
            -f compose/application.yml \
            up -d

      - name: Wait for Applications
        run: sleep 20

      #######################################################
      # Deploy Monitoring
      #######################################################

      - name: Deploy Monitoring
        run: |
          docker compose \
            --env-file compose/.env \
            --env-file compose/versions.env \
            -f compose/monitoring.yml \
            up -d

      - name: Wait for Monitoring
        run: sleep 20

      #######################################################
      # Health Checks
      #######################################################

      - name: Verify Running Containers
        run: docker ps

      #######################################################
      # OWASP ZAP - Authenticated Scan
      #######################################################

      - name: Test Gateway
        run: |
          curl -v "${{ vars.ZAP_TARGET_URL }}/actuator/health"

      - name: Get Keycloak Token
        run: |
          ZAP_ACCESS_TOKEN=$(curl -s -X POST "${{ vars.KEYCLOAK_TOKEN_URL }}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=password" \
            -d "client_id=${{ secrets.ZAP_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.ZAP_CLIENT_SECRET }}" \
            -d "username=${{ secrets.ZAP_USERNAME }}" \
            -d "password=${{ secrets.ZAP_PASSWORD }}" \
            | jq -r '.access_token')
          echo "ZAP_ACCESS_TOKEN=$ZAP_ACCESS_TOKEN" >> $GITHUB_ENV
          echo "Token fetched successfully"

      - name: Start ZAP Daemon
        run: |
          # Remove existing ZAP container if it exists
          docker rm -f zap || true

          docker run -d --name zap \
            --network=host \
            -v ${{ github.workspace }}:/zap/wrk \
            ghcr.io/zaproxy/zaproxy:stable \
            zap.sh -daemon \
            -host 0.0.0.0 \
            -port 8090 \
            -config api.disablekey=true \
            -config api.addrs.addr.name=.* \
            -config api.addrs.addr.regex=true \
            -config proxy.port=8092
          until curl -s http://127.0.0.1:8090/JSON/core/view/version/ | grep -q version; do
            echo "Waiting for ZAP..."
            sleep 10
          done
          echo "ZAP is ready!"

      - name: Run ZAP Authenticated Scan
        run: |
          # Set Authorization header - encode the token properly
          TOKEN="${{ env.ZAP_ACCESS_TOKEN }}"
          curl -v -G "http://127.0.0.1:8090/JSON/replacer/action/addRule/" \
            --data-urlencode "description=Authorization" \
            --data-urlencode "enabled=true" \
            --data-urlencode "matchType=REQ_HEADER" \
            --data-urlencode "matchString=Authorization" \
            --data-urlencode "replacement=Bearer $TOKEN"

          # Verify the rule was added
          curl -s "http://127.0.0.1:8090/JSON/replacer/view/rules/" | jq '.'

          # Create a context
          CONTEXT_ID=$(curl -s "http://127.0.0.1:8090/JSON/context/action/newContext/?contextName=IncidentHub" | jq -r '.contextId')
          echo "Context ID: $CONTEXT_ID"

          # Include all API endpoints in context
          curl -s "http://127.0.0.1:8090/JSON/context/action/includeInContext/?contextName=IncidentHub&regex=http://localhost:8880/api/.*"
          curl -s "http://127.0.0.1:8090/JSON/context/action/includeInContext/?contextName=IncidentHub&regex=http://localhost:8880/actuator/.*"

          # Manually add known API endpoints
          curl -s "http://127.0.0.1:8090/JSON/core/action/accessUrl/?url=http://localhost:8880/api/incidents&followRedirects=true"
          curl -s "http://127.0.0.1:8090/JSON/core/action/accessUrl/?url=http://localhost:8880/api/users&followRedirects=true"
          curl -s "http://127.0.0.1:8090/JSON/core/action/accessUrl/?url=http://localhost:8880/api/commentaires&followRedirects=true"
          curl -s "http://127.0.0.1:8090/JSON/core/action/accessUrl/?url=http://localhost:8880/api/chat&followRedirects=true"

          # Spider within the context
          SCAN_ID=$(curl -s "http://127.0.0.1:8090/JSON/spider/action/scan/?url=http://localhost:8880/api/&contextName=IncidentHub&maxChildren=10&recurse=true" | jq -r '.scan')
          echo "Spider scan ID: $SCAN_ID"
          sleep 30

          # Active scan within context
          ASCAN_ID=$(curl -s "http://127.0.0.1:8090/JSON/ascan/action/scan/?url=http://localhost:8880/api/&contextId=$CONTEXT_ID&recurse=true" | jq -r '.scan')
          echo "Active scan ID: $ASCAN_ID"

          # Wait for active scan to complete
          while true; do
            STATUS=$(curl -s "http://127.0.0.1:8090/JSON/ascan/view/status/?scanId=$ASCAN_ID" | jq -r '.status')
            echo "Scan progress: $STATUS%"
            if [ "$STATUS" = "100" ]; then break; fi
            sleep 15
          done

          # Generate reports
          curl -s "http://127.0.0.1:8090/OTHER/core/other/htmlreport/" > report.html
          curl -s "http://127.0.0.1:8090/OTHER/core/other/jsonreport/" > report.json
          curl -s "http://127.0.0.1:8090/OTHER/core/other/xmlreport/" > report.xml
          curl -s "http://127.0.0.1:8090/OTHER/core/other/mdreport/" > report.md
          echo "Reports generated!"

        continue-on-error: true

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            report.html
            report.json
            report.md
            report.xml