name: Pipeline 2 - Platform Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: read
  security-events: write

jobs:

  deploy-platform:

    runs-on:
      - self-hosted
      - Linux
      - X64
    env:
      # Config Server credentials
      GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
      GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
      
      # Vault
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      VAULT_PORT: ${{ secrets.VAULT_PORT }}
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}

    steps:
      - name: Checkout Infrastructure Repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GIT_TOKEN }}

      #######################################################
      # Deploy Infrastructure
      #######################################################

      - name: Deploy Infrastructure
        run: |
          docker compose \
            --env-file compose/.env \
            --env-file compose/versions.env \
            -f compose/infrastructure.yml \
            up -d

      - name: Wait for Infrastructure
        run: sleep 60

      #######################################################
      # Deploy Platform
      #######################################################
      - name: Deploy Platform
        run: |
          docker compose \
            --env-file compose/.env \
            --env-file compose/versions.env \
            -f compose/platform.yml \
            up -d

      - name: Wait for Platform
        run: sleep 120
      
      - name: Test Config Server Before Apps
        run: |
          docker exec config-server env | grep VAULT_PORT
          docker exec config-server env | grep SPRING_CLOUD_CONFIG_SERVER_VAULT
          curl -v https://removal-freemason-monogram.ngrok-free.dev/v1/sys/health || true
          docker logs config-server --tail=300

      #######################################################
      # Deploy Applications
      #######################################################

      - name: Deploy Applications
        run: |
          docker compose \
            --env-file compose/.env \
            --env-file compose/versions.env \
            -f compose/application.yml \
            up -d

      - name: Test config-server endpoint
        run: |
          curl -v http://localhost:8888/service-user/default || true
          docker logs config-server --tail=300
          

      - name: Wait for Applications
        run: sleep 60

      #######################################################
      # Deploy Monitoring
      #######################################################

      - name: Deploy Monitoring
        run: |
          docker compose \
            --env-file compose/.env \
            --env-file compose/versions.env \
            -f compose/monitoring.yml \
            up -d

      - name: Wait for Monitoring
        run: sleep 60

      #######################################################
      # Health Checks
      #######################################################

      - name: Verify Running Containers
        run: docker ps

      #######################################################
      # OWASP ZAP
      #######################################################

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://localhost:8080

      #######################################################
      # Upload Reports
      #######################################################

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html