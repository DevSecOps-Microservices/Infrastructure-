# =============================================================
# Prometheus Alert Rules
# Secure DevSecOps Project
#
# Covers:
# - Service availability
# - Performance
# - Security monitoring
# - Database health
#
# Alerts are forwarded to Alertmanager.
# =============================================================

groups:

# =============================================================
# SERVICE AVAILABILITY
# =============================================================
- name: service-availability

  rules:

  - alert: ServiceDown
    expr: up{job!="prometheus",job!="gateway-service"} == 0
    for: 1m

    labels:
      severity: critical

    annotations:
      summary: "{{ $labels.job }} is DOWN"
      description: >
        Prometheus has been unable to scrape
        {{ $labels.job }}
        for more than one minute.


  - alert: GatewayDown
    expr: up{job="gateway-service"} == 0
    for: 30s

    labels:
      severity: critical

    annotations:
      summary: Gateway unavailable
      description: >
        API Gateway is unavailable.
        Clients cannot access the platform.


# =============================================================
# PERFORMANCE
# =============================================================
- name: performance

  rules:

  - alert: HighContainerCPUUsage
    expr: |
      rate(
        container_cpu_usage_seconds_total{
        name=~"gateway-service|service-user|service-incident|comment-service|chat-service|config-server|eureka-service"
        }[2m]
      ) > 0.8
    for: 5m

    labels:
      severity: warning
      category: infrastructure

    annotations:
      summary: High container CPU usage
      description: >
        Container {{ $labels.name }}
        is consuming more than 80% of one CPU core.

  - alert: HighContainerMemoryUsage
    expr: |
      (
        container_memory_usage_bytes{
          name=~"gateway-service|service-user|service-incident|comment-service|chat-service|config-server|eureka-service"
        }
        /
        container_spec_memory_limit_bytes{
          name=~"gateway-service|service-user|service-incident|comment-service|chat-service|config-server|eureka-service"
        }
      ) > 0.85
    for: 5m

    labels:
      severity: warning
      category: infrastructure

    annotations:
      summary: High container memory usage
      description: >
        Container {{ $labels.name }}
        is using more than 85% of its allocated memory.


  - alert: HighErrorRate
    expr: |
      (
      rate(http_server_requests_seconds_count{status=~"5.."}[5m])
      /
      rate(http_server_requests_seconds_count[5m])
      ) > 0.05
    for: 2m

    labels:
      severity: critical

    annotations:
      summary: High HTTP 5xx rate
      description: >
        More than 5% of HTTP requests
        are returning server errors.

  - alert: ContainerRestarted
    expr: 
      changes(
        container_start_time_seconds{
          name=~"gateway-service|service-user|service-incident|comment-service|chat-service|config-server|eureka-service"
        }[10m]
      ) > 0
    for: 0m

    labels:
      severity: critical
      category: infrastructure

    annotations:
      summary: Container restarted
      description: >
        Container {{ $labels.name }}
        restarted unexpectedly.


# =============================================================
# SECURITY
# =============================================================
- name: security

  rules:

  - alert: Excessive401Responses
    expr: |
      rate(http_server_requests_seconds_count{status="401"}[5m]) > 5
    for: 2m

    labels:
      severity: critical

    annotations:
      summary: Possible brute-force attack
      description: >
        High number of HTTP 401 responses
        detected on {{ $labels.job }}.


  - alert: Excessive403Responses
    expr: |
      rate(http_server_requests_seconds_count{status="403"}[5m]) > 5
    for: 2m

    labels:
      severity: warning

    annotations:
      summary: Possible privilege abuse
      description: >
        High number of HTTP 403 responses
        detected on {{ $labels.job }}.


  - alert: AbnormalTrafficSpike
    expr: |
      rate(http_server_requests_seconds_count[1m]) > 100
    for: 1m

    labels:
      severity: critical

    annotations:
      summary: Abnormally high traffic
      description: >
        Request rate exceeded
        100 requests/second.
        Possible DoS or scanning activity.


# =============================================================
# DATABASE
# =============================================================
- name: database

  rules:

  - alert: DatabaseConnectionPoolNearlyFull
    expr: |
      hikaricp_connections_active
      /
      hikaricp_connections_max
      > 0.90
    for: 2m

    labels:
      severity: warning

    annotations:
      summary: Connection pool nearly exhausted
      description: >
        More than 90% of HikariCP
        connections are currently in use.


  - alert: DatabaseConnectionsTimeout
    expr: |
      increase(hikaricp_connections_timeout_total[5m]) > 0
    for: 1m

    labels:
      severity: critical

    annotations:
      summary: Database connection timeout
      description: >
        HikariCP reported connection
        timeouts during the last five minutes.